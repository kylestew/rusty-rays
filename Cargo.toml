[package]
name = "rusty-rays"
version = "0.1.0"
edition = "2021"
description = "A simple ray tracer written in Rust"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
minifb = { version = "0.28", optional = true }
# rand = {version = "0.8", optional = true }
rand       = "0.8"                       # RNG API (thread_rng, Rng, etc.)
getrandom  = { version = "0.2", features = ["js"] } # enable Web‑Crypto on wasm

[features]
default = ["desktop"]
desktop = ["minifb"]
